[project]
name = "ninecast"
version = "0.1.0"
description = "Aplicativo local para transformar conteudos de estudo em podcasts narrados."
requires-python = ">=3.12,<3.13"
dependencies = [
    "coqui-tts==0.28.0",
    "pymupdf>=1.24,<2",
    "python-dotenv==1.2.4",
    "six>=1.17,<2",
    "streamlit==1.67.0",
    "torch==2.15.0",
    "torchaudio==2.11.1",
    "torchcodec==0.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
